<body>
    <header>
        <h1>📷 SmartPOS</h1>
    </header>
    
    <div id="scanner-container">
        <!-- El marco de guía con las esquinas -->
        <div class="scan-frame">
            <div class="corner-bottom"></div>
            <div class="scan-line"></div>
        </div>
        <div id="result"></div>

    </div>
    
    <p class="hint">Apunta el código dentro del marco</p>

    <script src="js/sync.js"></script>
</body>
</html>
