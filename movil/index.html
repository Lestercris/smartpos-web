<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartPOS - Escáner</title>
    
    <!-- Librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    
    <!-- Nuestro diseño -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>📷 SmartPOS</h1>
    </header>
    
    <div id="scanner-container">
        <!-- Quagga inyecta el video aquí -->
        <div id="interactive"></div>
        
        <!-- El marco de guía -->
        <div class="scan-frame">
            <div class="corner-bottom"></div>
            <div class="scan-line"></div>
        </div>
        
        <div id="result"></div>
    </div>
    
    <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startScanner()">▶ Iniciar Escáner</button>
        <button id="stopBtn" class="btn-stop" onclick="stopScanner()">⏹ Detener</button>
    </div>
    
    <p class="hint">Apunta el código dentro del marco</p>

    <!-- Nuestra lógica -->
    <script src="js/sync.js"></script>
</body>
</html>
