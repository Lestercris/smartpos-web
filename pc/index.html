<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPOS - Punto de Venta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
 <header>
    <h1>SmartPOS</h1>
    <div style="display: flex; gap: 15px; align-items: center;">
        <button onclick="abrirAdmin()" style="background: #2563eb; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">⚙️ Productos</button>
        <div id="connection-status" class="status disconnected">Desconectado</div>
    </div>
</header>

    <main>
        <div class="pos-container">
            <!-- Panel Izquierdo: Carrito -->
            <div class="cart-panel">
                <h2>Carrito de Venta</h2>
                <div class="input-group">
                    <input type="text" id="posCode" placeholder="Escanee o escriba el código..." autofocus>
                    <button onclick="agregarProducto()">+ Agregar</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cant.</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartBody">
                        <tr><td colspan="6" class="empty">Carrito vacío</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Panel Derecho: Totales -->
            <div class="totals-panel">
                <h2>Resumen</h2>
                <div class="total-row"><span>Subtotal:</span><span id="tSub">$0.00</span></div>
                <div class="total-row"><span>IVA (18%):</span><span id="tIva">$0.00</span></div>
                <div class="total-row big"><span>TOTAL:</span><span id="tTot">$0.00</span></div>
                <button class="btn-cobrar" onclick="cobrar()">COBRAR</button>
            </div>
        </div>
    </main>
    <!-- Sección de Administración de Productos (Oculta por defecto) -->
<section id="product-management" style="display: none; padding: 20px;">
    <div style="max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Gestión de Productos</h2>
            <button onclick="cerrarAdmin()" style="background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">Volver al POS</button>
        </div>
        
        <!-- Formulario para añadir producto -->
        <div style="display: grid; grid-template-columns: 1fr 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px;">
            <input type="text" id="newCodigo" placeholder="Código" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="text" id="newNombre" placeholder="Nombre del producto" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="number" id="newPrecio" placeholder="Precio" step="0.01" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="number" id="newStock" placeholder="Stock" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <button onclick="guardarProducto()" style="background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Añadir</button>
        </div>

        <!-- Tabla de productos -->
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f1f5f9; text-align: left;">
                    <th style="padding: 12px;">Código</th>
                    <th style="padding: 12px;">Nombre</th>
                    <th style="padding: 12px;">Precio</th>
                    <th style="padding: 12px;">Stock</th>
                    <th style="padding: 12px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Aquí se cargarán los productos -->
            </tbody>
        </table>
    </div>
</section>

    <!-- Nuestros módulos -->
    <script src="js/db.js"></script>
    <script src="js/pos.js"></script>
    <script src="js/realtime.js"></script>
</body>
</html>
