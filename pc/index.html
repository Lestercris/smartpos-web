<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPOS - Punto de Venta</title>
    
    <!-- Librerías base -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="modulos/ticket/ticket.css">
</head>
<body>
    <header class="app-header">
        <h1>SmartPOS</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="abrirAdmin()">⚙️ Productos</button>
            <div id="connection-status" class="status disconnected">Desconectado</div>
        </div>
    </header>

    <main>
        <!-- ================= VISTA POS ================= -->
        <div class="pos-container" id="pos-view">
            <!-- Panel Izquierdo: Carrito -->
            <div class="cart-panel">
                <h2 class="panel-title">Carrito de Venta</h2>
                <div class="input-group">
                    <input type="text" id="posCode" placeholder="Escanee o escriba el código..." autofocus>
                    <button class="btn btn-primary" onclick="agregarProducto()">+ Agregar</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cant.</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartBody">
                        <tr><td colspan="6" class="empty">Carrito vacío</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Panel Derecho: Totales -->
            <div class="totals-panel">
                <h2 class="panel-title">Resumen</h2>
                <div class="total-row"><span>Subtotal:</span><span id="tSub">$0.00</span></div>
                <div class="total-row"><span>IVA (18%):</span><span id="tIva">$0.00</span></div>
                <div class="total-row big"><span>TOTAL:</span><span id="tTot">$0.00</span></div>
                <button class="btn btn-success btn-cobrar" onclick="cobrar()">COBRAR</button>
            </div>
        </div>

        <!-- ================= VISTA ADMINISTRACIÓN ================= -->
        <section id="product-management" class="admin-section hidden">
            <div class="admin-card">
                
                <div class="admin-header">
                    <h2>Gestión de Productos</h2>
                    <div class="admin-actions">
                        <!-- Botón para descargar la plantilla Excel -->
                        <button class="btn btn-primary" onclick="descargarPlantillaExcel()">📄 Descargar Plantilla</button>
                        
                        <!-- Botones de importación/exportación -->
                        <button class="btn btn-success" onclick="exportarProductosExcel()">📤 Exportar Excel</button>
                        <button class="btn btn-purple" onclick="document.getElementById('fileInput').click()">📥 Importar Excel</button>
                        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="importarProductosExcel(event)">
                        
                        <!-- Botón de etiquetas y volver -->
                        <button class="btn btn-warning" onclick="abrirGeneradorEtiquetas()">🖨️ Etiquetas</button>
                        <button class="btn btn-danger" onclick="cerrarAdmin()">Volver al POS</button>
                    </div>
                </div>
                
                <!-- Formulario para añadir producto manualmente -->
                <div class="form-grid">
                    <input type="text" id="newCodigo" placeholder="Código">
                    <input type="text" id="newNombre" placeholder="Nombre del producto">
                    <input type="number" id="newPrecio" placeholder="Precio" step="0.01">
                    <input type="number" id="newStock" placeholder="Stock">
                    <button class="btn btn-primary" onclick="guardarProducto()">+ Añadir</button>
                </div>

                <!-- Tabla de productos -->
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- Aquí se cargarán los productos -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Nuestros scripts (El orden importa) -->
    <script src="js/db.js"></script>
    <script src="js/pos.js"></script>
    <script src="js/realtime.js"></script>
    <script src="modulos/ticket/ticket.js"></script>
</body>
</html>
